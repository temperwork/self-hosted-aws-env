name: terraform

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4

      - name: Format
        run: terraform fmt -check -recursive -diff

      - name: Validate
        run: |
          for dir in modules/temperwork examples/complete examples/existing-network; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - name: Test
        run: terraform -chdir=modules/temperwork test

      - name: Docs' links to policy lines
        run: python3 .github/scripts/check_doc_anchors.py

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck modules/temperwork/*.sh
